  color: var(--c-gold);
  transition: opacity 700ms var(--ease), visibility 0s linear 700ms;
}
body.is-ready #loading { opacity: 0; visibility: hidden; pointer-events: none; }
.nd-load { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.nd-load-mark { position: relative; width: 132px; height: 132px; }
.nd-load-mark svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.nd-load-glow {
  position: absolute;
  inset: -40px;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(246, 190, 100, 0.36), rgba(246, 190, 100, 0) 70%);
  animation: nd-flicker 2.8s ease-in-out infinite;
}
.nd-load-mark .draw {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.2;
  stroke-linejoin: round;
  stroke-linecap: round;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  animation: nd-draw 2.6s var(--ease-in-out) infinite;
}
.nd-load-mark .ghost { fill: none; stroke: currentColor; stroke-width: 1; stroke-linejoin: round; opacity: 0.2; }
.nd-load-mark .draw.d2 { animation-delay: 0.25s; opacity: 0.75; }
.nd-load-mark .draw.d3 { animation-delay: 0.5s; opacity: 0.5; stroke-width: 0.9; }
.nd-load-mark .flame { transform-origin: 66px 78px; filter: drop-shadow(0 0 6px rgba(255, 200, 110, 0.9)); animation: nd-flame 1.6s ease-in-out infinite; }
.nd-load-title {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 0.32em;
  padding-left: 0.32em;
  text-transform: uppercase;
  color: var(--c-text);
}
.nd-load-text { margin-top: -10px; font-family: var(--font-body); font-style: italic; font-size: 18px; color: var(--c-text-muted); }

#fatal {
  position: fixed;
  inset: 0;
  z-index: 110;
  display: grid;
  place-items: center;
  padding: 24px;
  background: radial-gradient(ellipse at 50% 45%, #170d12, #050406 75%);
}
#fatal[hidden] { display: none; }
body.is-fatal #fatal { display: grid; }
.nd-fatal-card {
  max-width: 520px;
  padding: 30px 36px 32px;
  text-align: center;
  border-radius: var(--radius-l);
  border: 1px solid rgba(214, 90, 98, 0.5);
  background: rgba(20, 10, 14, 0.9);
  box-shadow: var(--shadow-panel), 0 0 50px -16px var(--c-blood-glow);
}
.nd-fatal-card h2 {
  margin: 0 0 8px;
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--c-text);
}
.nd-fatal-card p { margin: 0; font-size: 18px; line-height: 1.45; color: var(--c-text-muted); }
.nd-fatal-card .fatal-detail { margin-top: 12px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: #e0a9a6; word-break: break-word; }
.nd-fatal-card .fatal-detail:empty { display: none; }

/* ------------------------------------------------------------------ large displays: scale the panels up
 * Applied per panel (never to #ui-root itself) so the per-die value labels, which render/labels.js
 * positions in screen pixels, are not displaced. ui.js divides tooltip coordinates by this zoom. */
@media (min-width: 1800px) and (min-height: 1000px) {
  :root { --ui-zoom: 1.12; }
}
@media (min-width: 2200px) and (min-height: 1250px) {
  :root { --ui-zoom: 1.3; }
}
.nd-brand, .nd-top-actions, .nd-plaque, .nd-drawer, .nd-dock, .nd-toasts, .nd-popover, .nd-help-card, .nd-tip {
  zoom: var(--ui-zoom, 1);
}
body.is-phone { --ui-zoom: 1; }

/* ------------------------------------------------------------------ low quality: drop the costly blur */
html[data-quality='low'] { --blur: 0px; }
html[data-quality='low'] .nd-panel { background-color: rgba(16, 11, 20, 0.9); }

/* ------------------------------------------------------------------ smaller desktop windows (full layout) */
@media (max-height: 780px) {
  body:not(.is-phone):not(.is-compact) { --top-h: 70px; --plaque-inner: 106px; }
  body:not(.is-phone):not(.is-compact) .nd-die { height: 64px; width: 58px; padding-top: 5px; }
  body:not(.is-phone):not(.is-compact) .nd-die .die-ico { width: 36px; height: 36px; }
  body:not(.is-phone):not(.is-compact) .nd-cast { width: 102px; height: 102px; }
  body:not(.is-phone):not(.is-compact) .nd-cast-face { width: 80px; height: 80px; }
  body:not(.is-phone):not(.is-compact) .nd-total { font-size: 56px; margin: 2px 0 4px; }
  body:not(.is-phone):not(.is-compact) .nd-plaque { padding-top: 12px; padding-bottom: 13px; }
  body:not(.is-phone):not(.is-compact) .nd-dock { padding-top: 12px; padding-bottom: 12px; }
  body:not(.is-phone):not(.is-compact) .nd-dock-main { gap: 10px; }
}
@media (max-width: 1100px) {
  body:not(.is-phone) .nd-plaque { max-width: calc(100vw - 340px); min-width: 300px; }
}

/* The Table as a 3-up thumbnail grid (art on top, name below) where a list would scroll */
@media (max-height: 780px) {
  body:not(.is-phone) .nd-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  body:not(.is-phone) .nd-card { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 5px; padding: 8px 4px 9px; max-height: none; }
  body:not(.is-phone) .nd-card-blurb { display: none; }
  body:not(.is-phone) .nd-card-name { font-size: 12px; letter-spacing: 0.03em; line-height: 1.2; }
  body:not(.is-phone) .nd-cards--towers .nd-card { grid-template-columns: 1fr; }
  body:not(.is-phone) .nd-cards--towers .nd-card .art { width: 44px; height: 55px; }
}

/* ------------------------------------------------------------------ hover-less devices: no sticky hover looks */
@media (hover: none) {
  .nd-die:hover { border-color: var(--c-line-faint); background: linear-gradient(180deg, rgba(255, 236, 200, 0.03), rgba(255, 236, 200, 0) 70%); color: var(--c-gold); --die-num: var(--c-text-muted); }
  .nd-die:hover .die-ico { transform: none; }
  .nd-die.is-active:hover {
    color: var(--c-gold-bright);
    border-color: rgba(201, 162, 92, 0.55);
    background: radial-gradient(ellipse 70% 60% at 50% 40%, rgba(230, 190, 110, 0.2), transparent 75%), linear-gradient(180deg, rgba(255, 236, 200, 0.06), rgba(255, 236, 200, 0.01));
    --die-num: var(--c-gold-pale);
  }
  .nd-round:hover { color: var(--c-gold); border-color: var(--c-line); }
  .nd-cast:hover .nd-cast-face { border-color: rgba(230, 190, 110, 0.7); }
  .nd-preset:hover .gem { transform: none; }
  .nd-swatch:hover, .nd-swatch-custom:hover { transform: none; }
  .nd-tip { display: none; }
}

/* ------------------------------------------------------------------ compact layout
 * 761-960 px wide, or a desktop window under 700 px tall: one-row dock (dice | formula | More | Cast),
 * Modifier / Mode / Clear in the "More" popover, a slimmer plaque, the wordmark down to its sigil. */
body.is-compact { --top-h: 60px; --plaque-inner: 78px; --edge: 12px; }
body.is-compact .nd-brand { top: 12px; left: 14px; }
body.is-compact .nd-brand .sigil { width: 32px; height: 32px; }
body.is-compact .nd-brand > div { display: none; }
body.is-compact .nd-top-actions { top: 12px; right: 14px; gap: 8px; }
body.is-compact .nd-round { width: 40px; height: 40px; }
body.is-compact .nd-plaque { top: 12px; padding: 4px 22px 5px; min-width: 300px; max-width: min(540px, calc(100vw - 400px)); }
body.is-compact .nd-total { font-size: 36px; margin: 1px 0 3px; }
body.is-compact .nd-plaque-label { font-size: 11px; height: 14px; line-height: 14px; }
body.is-compact .nd-plaque-label .nd-formula-text { font-size: 14px; }
body.is-compact .nd-breakdown { height: 24px; }
body.is-compact .nd-breakdown .nd-chip { height: 22px; font-size: 13.5px; padding: 0 7px 0 4px; }
body.is-compact .nd-plaque-empty .nd-rule { display: none; }
body.is-compact .nd-plaque-empty .nd-invite { font-size: 23px; }
body.is-compact .nd-plaque-empty .nd-hint { margin-top: 5px; font-size: 14.5px; }
body.is-compact .nd-plaque-rolling { flex-direction: row; gap: 10px; }
body.is-compact .nd-plaque-rolling .sigil { width: 30px; height: 30px; }
body.is-compact .nd-plaque-rolling .nd-plaque-label::before,
body.is-compact .nd-plaque-rolling .nd-plaque-label::after { display: none; }
body.is-compact .nd-plaque-rolling .nd-rolling-text { font-size: 16px; }
body.is-compact .nd-plaque-charging { gap: 6px; }
body.is-compact .nd-charge-text { font-size: 17px; }
body.is-compact .nd-dock { bottom: 12px; padding: 10px 12px 10px 14px; max-width: calc(100vw - 20px); }
body.is-compact .nd-dock-main { gap: 0; justify-content: center; }
body.is-compact .nd-dock-row { gap: 10px; align-items: center; }
body.is-compact .nd-dock-row--controls { display: none; }
body.is-compact .nd-dice { gap: 4px; }
body.is-compact .nd-die { width: 44px; height: 50px; padding-top: 4px; border-radius: 9px; }
body.is-compact .nd-die .die-ico { width: 28px; height: 28px; }
body.is-compact .nd-die-label { font-size: 12px; margin-top: 1px; }
body.is-compact .nd-die .nd-pulse { top: 18px; width: 34px; height: 34px; margin: -17px 0 0 -17px; }
body.is-compact .nd-badge { top: -7px; right: -6px; min-width: 20px; height: 20px; font-size: 11.5px; padding: 0 5px; }
body.is-compact .nd-formula { width: clamp(150px, 22vw, 240px); }
body.is-compact .nd-formula > .nd-cap { display: none; }
body.is-compact .nd-more-btn {
  display: grid;
  place-items: center;
  flex: none;
  position: relative;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  color: var(--c-gold);
  border: 1px solid var(--c-line-soft);
  background: rgba(6, 4, 8, 0.45);
  transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
body.is-compact .nd-more-btn .ico { width: 19px; height: 19px; }
body.is-compact .nd-more-btn:hover, body.is-compact .nd-more-btn[aria-expanded='true'] { color: var(--c-gold-pale); border-color: var(--c-line-strong); }
body.is-compact .nd-more-btn.has-value::after,
body.is-phone .nd-handle.has-value::after {
  content: '';
  position: absolute;
  top: 3px;
  right: 3px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--c-ember);
  box-shadow: 0 0 6px var(--c-ember-glow);
}
body.is-compact .nd-dock-sep { margin: 2px 12px 2px 14px; }
body.is-compact .nd-cast { width: 76px; height: 76px; }
body.is-compact .nd-cast-face { width: 60px; height: 60px; gap: 0; }
body.is-compact .nd-cast-face .sigil { width: 18px; height: 18px; }
body.is-compact .nd-cast-label { font-size: 12px; letter-spacing: 0.2em; padding-left: 0.2em; }
/* the More popover: modifier, roll mode, clear */
body.is-compact .nd-sheet {
  display: block;
  position: absolute;
  right: 96px;
  bottom: calc(100% + 12px);
  z-index: 6;
  width: 372px;
  padding: 14px 16px 14px;
  border-radius: var(--radius-l);
  background: var(--grain), rgba(16, 11, 20, 0.95);
  border: 1px solid var(--c-line);
  box-shadow: var(--shadow-panel), var(--inset-top);
  opacity: 0;
  visibility: hidden;
  transform: translateY(6px);
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease), visibility 0s linear var(--dur);
}
body.is-compact .nd-sheet.is-open { opacity: 1; visibility: visible; transform: none; transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease); }
body.is-compact .nd-sheet-inner { display: flex; flex-direction: column; gap: 14px; }
body.is-compact .nd-sheet-row--mods { display: flex; flex-direction: column; gap: 14px; }
body.is-compact .nd-sheet-row--mods .nd-seg button { flex: 1; }
body.is-compact .nd-sheet-row--formula, body.is-compact .nd-sheet-presets { display: none; }
body.is-compact .nd-sheet-row--actions { display: flex; justify-content: flex-end; }
body.is-compact .nd-drawer { top: calc(var(--top-h) + 6px); bottom: calc(var(--dock-h) + 24px); }
body.is-compact .nd-ribbons { top: 8px; }
body.is-compact .nd-toasts { bottom: calc(var(--dock-h) + 26px); }
body.is-compact .nd-popover { top: 60px; right: 14px; max-height: calc(100vh - 72px); overflow-y: auto; }

/* ------------------------------------------------------------------ phone layout (4.10)
 * Portrait reference 390 x 844. Slim header, compact plaque, a bottom bar with one row of dice chips
 * and a round Cast, a pull-up sheet for the rest, the drawers as bottom sheets from the menu button.
 * The tray owns the band between the plaque and the bar (ui.getInsets). */
body.is-phone { --plaque-inner: 84px; --edge: 10px; --psheet-h: 62vh; }
@supports (height: 100dvh) { body.is-phone { --psheet-h: 62dvh; } }
body.is-phone #ui-root { --dock-h: 96px; }
/* portrait: a dusk gradient behind the header and the plaque, so a candle pushed up under them (push-ins near
   the head rail) reads as a soft glow instead of a bright blob right behind the wordmark */
body.is-phone:not(.is-landscape) #ui-root::before {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: calc(var(--plaque-bottom, 160px) + 6px);
  background: linear-gradient(180deg, rgba(8, 5, 10, 0.8) 0%, rgba(8, 5, 10, 0.6) 72%, rgba(8, 5, 10, 0) 100%);
  pointer-events: none;
}

/* header */
body.is-phone .nd-brand { top: calc(var(--safe-t) + 13px); left: calc(var(--safe-l) + 14px); gap: 9px; }
body.is-phone .nd-brand::before { inset: -20px -40px -20px -30px; }
body.is-phone .nd-brand .sigil { width: 30px; height: 30px; }
body.is-phone .nd-brand-name { font-size: 14px; letter-spacing: 0.17em; }
body.is-phone .nd-brand-tag { display: none; }
body.is-phone .nd-top-actions { top: calc(var(--safe-t) + 6px); right: calc(var(--safe-r) + 8px); gap: 4px; z-index: 4; }
body.is-phone .nd-round { width: 44px; height: 44px; }
body.is-phone .nd-round .ico { width: 21px; height: 21px; }
body.is-phone .nd-help-btn { display: none; }

/* phones: the crit seal takes the label's place at the top (the chip row sits too close to the bottom edge) */

/* the bar */

/* dice chips: >= 44 px wide, one row, scrolls sideways if the phone is narrow */
body.is-phone .nd-dice {
  display: flex;

}

body.is-phone .nd-dice.is-overflowing.at-end { -webkit-mask-image: linear-gradient(90deg, transparent, #000 26px); mask-image: linear-gradient(90deg, transparent, #000 26px); }
body.is-phone .nd-die-wrap { flex: 1 0 44px; min-width: 44px; max-width: 60px; display: flex; justify-content: center; }
body.is-phone .nd-die {
  width: calc(100% - 4px);
  height: 56px;
  padding-top: 5px;
  border-radius: 12px;
  -webkit-touch-callout: none;
}
body.is-phone .nd-die .die-ico { width: 30px; height: 30px; }
body.is-phone .nd-die-label { font-size: 13px; margin-top: 2px; }

}

/* the round Cast with its hold ring */
body.is-phone .nd-dock-cast { grid-area: cast; align-self: end; padding: 0; }

}

body.is-phone .nd-sheet-inner > :first-child { margin-top: 6px; }

body.is-phone .nd-sheet-row--mods { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
body.is-phone .nd-sheet-row--mods .nd-clear { margin-bottom: 0; }
body.is-phone .nd-sheet-row--actions { display: block; }

body.is-phone .nd-sheet .nd-clear { height: 42px; }
body.is-phone .nd-sheet .nd-formula { width: 100%; }

body.is-phone .nd-sheet-presets { display: flex; flex-direction: column; gap: 7px; }

body.is-phone .nd-quick-pills { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; touch-action: pan-x; }
body.is-phone .nd-quick-pills::-webkit-scrollbar { display: none; }
.nd-pill {
  flex: none;
  display: inline-flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;

/* tap-outside scrim behind phone sheets (keeps the plaque and the header bright) */

/* Forge / Table / Chronicle / Grimoire: bottom sheets with four tabs, their own scroll, drag down to close */

/* shake-to-roll invitation (one time), above the bar */

  top: calc(var(--safe-t) + 56px);

/* ------------------------------------------------------------------ motion */
@keyframes nd-spin { to { transform: rotate(360deg); } }
@keyframes nd-shimmer { from { background-position: 130% 0; } to { background-position: -130% 0; } }
@keyframes nd-reveal { from { opacity: 0; transform: scale(0.9); filter: blur(3px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes nd-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes nd-chip-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes nd-halo { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); } 35% { opacity: 1; } 100% { opacity: 0.55; transform: translate(-50%, -50%) scale(1); } }
@keyframes nd-badge { 0% { transform: scale(0.7); } 100% { transform: scale(1); } }
@keyframes nd-pulse { 0% { opacity: 0.9; transform: scale(0.75); } 100% { opacity: 0; transform: scale(1.45); } }
@keyframes nd-pulse-in { 0% { opacity: 0.8; transform: scale(1.3); } 100% { opacity: 0; transform: scale(0.7); } }
@keyframes nd-breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
@keyframes nd-rattle { 0% { translate: calc(var(--charge) * -0.8px) calc(var(--charge) * 0.6px); } 100% { translate: calc(var(--charge) * 0.8px) calc(var(--charge) * -0.5px); } }
@keyframes nd-release { 0% { box-shadow: 0 0 0 0 rgba(246, 212, 136, 0.7), inset 0 0 0 5px rgba(246, 212, 136, 0.6); } 100% { box-shadow: 0 0 0 18px rgba(246, 212, 136, 0), inset 0 0 0 5px rgba(201, 162, 92, 0.35); } }
@keyframes nd-entry-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
@keyframes nd-toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes nd-toast-out { to { opacity: 0; transform: translateY(4px); } }
@keyframes nd-pending { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.9; } }
@keyframes nd-pop-in { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: none; } }
@keyframes nd-coach-in { from { opacity: 0; translate: 0 -4px; } to { opacity: 1; translate: 0 0; } }
@keyframes nd-draw { 0% { stroke-dashoffset: 1; } 45%, 60% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -1; } }
@keyframes nd-flicker { 0%, 100% { opacity: 0.85; transform: scale(1); } 30% { opacity: 1; transform: scale(1.04); } 55% { opacity: 0.72; transform: scale(0.98); } 75% { opacity: 0.95; } }
@keyframes nd-flame { 0%, 100% { transform: scale(1, 1) skewX(0); } 35% { transform: scale(0.95, 1.06) skewX(-2deg); } 70% { transform: scale(1.03, 0.96) skewX(2deg); } }

@media (prefers-reduced-motion: reduce) {
  :root { --dur-fast: 1ms; --dur: 1ms; --dur-slow: 1ms; }
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
  .nd-cast::before { animation: none; opacity: 0.8; }
  .nd-plaque[data-state='rolling']::after { animation: none; background-position: 50% 0; }
  .nd-load-mark .draw { animation: none; stroke-dashoffset: 0; }
  .nd-load-glow, .nd-load-mark .flame { animation: none; }
}

/* "choose some dice first": the dock's dice glow once */
.nd-dice.is-hint .nd-die { animation: nd-hint 700ms var(--ease) both; }
.nd-dice.is-hint .nd-die-wrap:nth-child(2) .nd-die { animation-delay: 40ms; }
.nd-dice.is-hint .nd-die-wrap:nth-child(3) .nd-die { animation-delay: 80ms; }
.nd-dice.is-hint .nd-die-wrap:nth-child(4) .nd-die { animation-delay: 120ms; }
.nd-dice.is-hint .nd-die-wrap:nth-child(5) .nd-die { animation-delay: 160ms; }
.nd-dice.is-hint .nd-die-wrap:nth-child(6) .nd-die { animation-delay: 200ms; }
.nd-dice.is-hint .nd-die-wrap:nth-child(7) .nd-die { animation-delay: 240ms; }
@keyframes nd-hint {
  0%, 100% { border-color: var(--c-line-faint); box-shadow: none; }
  35% { border-color: rgba(246, 212, 136, 0.8); box-shadow: 0 0 16px -4px rgba(246, 200, 110, 0.6); }
}

varying vec3 vNdObj;

uniform sampler3D ndNoiseTex;
uniform vec3 ndBody;
uniform vec3 ndAccent;
uniform vec3 ndInk;
uniform float ndInkRough;
uniform float ndInkMetal;
uniform vec3 ndGlitterColor;
uniform float ndGlitter;
uniform float ndFlakeDensity;
uniform int ndInclusion;
uniform int ndFinish;
uniform vec3 ndSeed;
uniform vec4 ndPlanes[ ${ca} ];
uniform int ndPlaneCount;
uniform float ndInradius;
uniform float ndTransRough;
uniform float ndMilk;
uniform vec3 ndMilkColor;
uniform float ndVolLight;
uniform float ndTIR;
uniform float ndGlow;
uniform float ndDark;
uniform vec3 ndTransTint;     // color filter of light passing through (decoupled from the surface diffuse)
uniform int ndSteps;
uniform float ndTime;
uniform vec4 ndHL;          // x hover/held, y crit20, z crit1, w dropped
uniform float ndPearl;
uniform int ndLoop8;        // = 8 (uniform loop bounds keep FXC from unrolling)
uniform int ndLayerSteps;

float ndPix = 0.01;                  // object-space size of one pixel here (set in main), keeps stars >= ~1 px
float ndCoreAmt = 1.0;               // smoke gathers in the core of see-through dice, everywhere in opaque ones
const float ND_FLAKE_CELL = 0.034;   // cm, opaque glitter flake size
const float ND_STAR_CELL = 0.085;    // cm, galaxy star lattice

vec3 ndHash33( vec3 p3 ) {
	p3 = fract( p3 * vec3( 0.1031, 0.1030, 0.0973 ) );
	p3 += dot( p3, p3.yxz + 33.33 );
	return fract( ( p3.xxy + p3.yxx ) * p3.zyx );
}

// four independent gradient noises in [-1, 1] (p in noise cells, period 16)
vec4 ndN( vec3 p ) {
	return textureLod( ndNoiseTex, p * 0.0625, 0.0 ) * 2.0 - 1.0;
}
vec4 ndFbm4( vec3 p ) {
	return 0.5333 * ndN( p ) + 0.2667 * ndN( p * 2.03 + vec3( 1.7, 9.2, 4.1 ) )
		+ 0.1333 * ndN( p * 4.07 + vec3( 5.3, 2.1, 7.7 ) ) + 0.0667 * ndN( p * 8.13 + vec3( 3.9, 6.6, 0.4 ) );
}
vec4 ndFbm2( vec3 p ) {
	return 0.6667 * ndN( p ) + 0.3333 * ndN( p * 2.03 + vec3( 1.7, 9.2, 4.1 ) );
}

// Marbled swirl: x = broad accent bands, y = thin veins, z = raw warp value (for pearl / variation).
vec3 ndSwirl( vec3 p ) {
	vec3 q = p * 1.35 + ndSeed;
	vec3 r = q + 1.5 * ndFbm2( q ).xyz;
	float f = ndFbm4( r * 1.3 ).x;
	float band = sin( dot( r, vec3( 1.9, 1.1, 0.6 ) ) + f * 4.0 );
	float broad = smoothstep( 0.1, 0.95, band );
	float thin = 1.0 - smoothstep( 0.0, 0.035, abs( sin( dot( r, vec3( -0.6, 2.4, 1.3 ) ) * 1.4 + f * 6.5 ) ) );
	// veins fade in and out along their length (marble), instead of running on as even contour lines
	thin *= smoothstep( -0.12, 0.3, ndFbm4( r * 2.7 + vec3( 3.1, 7.4, 1.9 ) ).y );
	return vec3( broad, thin, f );
}

// Smoke density: ridged wisps concentrated toward the core.
float ndSmoke( vec3 p ) {
	vec3 q = p * 1.6 + ndSeed;
	vec4 w = ndFbm2( q * 0.7 );
	float n = ndFbm4( q * 1.25 + 1.8 * w.xyz ).x;
	float wisp = pow( clamp( 1.0 - abs( n ) * 3.2, 0.0, 1.0 ), 3.0 );
	float body = smoothstep( -0.15, 0.45, w.w );
	float core = mix( 1.0, 1.0 - smoothstep( 0.05, 1.0, length( p ) / ndInradius ), ndCoreAmt );
	return wisp * ( 0.35 + 0.65 * body ) * core;
}

// Galaxy nebula: rgb = color, a = density.
vec4 ndNebula( vec3 p ) {
	vec3 q = p * 1.35 + ndSeed;
	vec4 w = ndFbm2( q );
	float n = ndFbm4( q * 1.5 + 1.4 * w.xyz ).x;
	float d = smoothstep( -0.05, 0.5, n );
	float hot = smoothstep( 0.3, 0.65, n );
	// two cloud hues: the accent, and a cool glow lifted from the body color, plus hot pale cores
	vec3 cool = normalize( ndBody + 0.02 ) * 0.55 + vec3( 0.02, 0.05, 0.12 );
	vec3 col = mix( cool, ndAccent, smoothstep( 0.2, 0.75, w.w * 0.5 + 0.5 ) );
	col = mix( ndBody * 1.5 + 0.01, col, d );
	col += mix( ndAccent, vec3( 1.0, 0.85, 0.95 ), 0.45 ) * hot * 0.8;
	return vec4( col, d );

// Star specks seen along a ray: stars whose slab [t - dt/2, t + dt/2) contains them (each counted once).
vec3 ndStars( vec3 q, vec3 ro, vec3 rd, float t, float dt ) {
	vec3 base = floor( q / ND_STAR_CELL - 0.5 );
	vec3 acc = vec3( 0.0 );
	float dens = 0.18 + 0.5 * ndGlitter;
	for ( int k = 0; k < ndLoop8; k ++ ) {
		vec3 c = base + vec3( float( k & 1 ), float( ( k >> 1 ) & 1 ), float( ( k >> 2 ) & 1 ) );
		vec3 h = ndHash33( c + 0.37 );
		if ( h.z > dens ) continue;
		vec3 s = ( c + 0.15 + 0.7 * ndHash33( c + 7.1 ) ) * ND_STAR_CELL;
		vec3 d = s - ro;
		float ts = dot( d, rd );
		if ( abs( ts - t ) > dt * 0.5 ) continue;
		float dp = length( d - rd * ts );
		float r0 = ND_STAR_CELL * mix( 0.035, 0.1, h.x * h.x );
		float r = max( r0, ndPix * 0.8 );                 // never thinner than a pixel...
		float b = smoothstep( r, 0.0, dp );
		b *= b * ( r0 * r0 ) / ( r * r );                  // ...but with the same total light
		float tw = 0.65 + 0.35 * sin( ndTime * ( 1.3 + 3.0 * h.y ) + h.x * 40.0 );
		vec3 tint = mix( ndGlitterColor, mix( ndAccent, vec3( 1.0 ), 0.6 ), step( 0.7, h.y ) * 0.6 );
		acc += tint * b * tw * mix( 0.85, 3.1, h.y * h.y );

}

// Distance from p (inside or on the surface) along unit d to the die's surface (convex: its face planes).
float ndExit( vec3 p, vec3 d ) {
	float t = 4.0 * ndInradius;
	for ( int i = 0; i < ndPlaneCount; i ++ ) {
		vec4 pl = ndPlanes[ i ];
		float dn = dot( pl.xyz, d );
		if ( dn > 1e-4 ) t = min( t, ( pl.w - dot( pl.xyz, p ) ) / dn );
	}
	return max( t, 0.0 );
}

// Volume march through the die interior (object space). Returns rgb = in-scattered color per unit ambient
// light, a = transmittance; emit = self-emission (stars, glow); keyed = in-scatter of the dominant direct light,
// already attenuated along the path from each sample toward that light (keyOn > 0 only): thin parts and the
// lit side glow, the far side stays deep - a cheap subsurface look.
vec4 ndMarch( vec3 ro, vec3 rd, float len, int steps, float milk, vec3 keyObj, float keyOn, out vec3 emit, out vec3 keyed ) {
	emit = vec3( 0.0 );
	keyed = vec3( 0.0 );
	vec3 col = vec3( 0.0 );

	float dt = len / float( steps );
	float jit = fract( 52.9829189 * fract( dot( gl_FragCoord.xy, vec2( 0.06711056, 0.00583715 ) ) ) );

		if ( T < 0.01 ) break;

		vec3 albedo = ndMilkColor * milk;

		if ( ndInclusion == 4 ) {
			// smoke: dark at its densest, its edges catch a little light (a lit haze in the body color)
			float sm = ndSmoke( p );
			float s = sm * 14.0;
			sigma += s;
			albedo += mix( ndBody * 0.45 + 0.01, ndAccent * 0.6, smoothstep( 0.04, 0.3, sm ) ) * s;
		} else if ( ndInclusion == 3 ) {
			vec4 nb = ndNebula( p );
			float s = nb.a * 2.6;
			float dark = ndDark * ( 1.0 - nb.a );   // dark space between the clouds (see-through dice)
			sigma += s + dark;
			albedo += nb.rgb * s + ndBody * 0.5 * dark;
			e += nb.rgb * nb.a * 0.8;
			e += ndStars( ro + rd * t, ro, rd, t, dt ) / max( dt, 1e-3 ) * 1.1;
		} else if ( ndInclusion == 2 ) {
			vec3 sw = ndSwirl( p );
			float s = sw.x * 1.4 + sw.y * 3.5;
			sigma += s;
			albedo += mix( ndAccent, mix( ndAccent, vec3( 1.0 ), 0.35 ), sw.y ) * s;
		}

		if ( ndHL.y > 0.0 ) {
			float core = 1.0 - smoothstep( 0.0, 1.0, length( p ) / ndInradius );
			e += vec3( 1.0, 0.68, 0.24 ) * ndHL.y * core * ( 0.75 + 0.25 * sin( ndTime * 3.4 ) ) * 0.45;   // a hint: the resin keeps its colour
		}
		if ( sigma > 1e-4 ) {
			float a = 1.0 - exp( - sigma * dt );
			float w = T * a / sigma;

				keyed += w * albedo * Tl;
			}
		} else {
			emit += T * e * dt;
		}
		T *= exp( - sigma * dt );
	}
	return vec4( col, T );
}

// Opaque glitter: nearest flake cell (approximate voronoi, 2x2x2) -> random flake normal + presence mask.
void ndFlake( vec3 p, out vec3 nObj, out float mask ) {
	vec3 q = p / ND_FLAKE_CELL + ndSeed * 3.7;
	vec3 base = floor( q - 0.5 );
	float best = 1e9;
	vec3 bestC = base;
	for ( int k = 0; k < ndLoop8; k ++ ) {
		vec3 c = base + vec3( float( k & 1 ), float( ( k >> 1 ) & 1 ), float( ( k >> 2 ) & 1 ) );
		vec3 d = c + ndHash33( c ) - q;
		float dd = dot( d, d );
		if ( dd < best ) { best = dd; bestC = c; }
	}
	vec3 h = ndHash33( bestC + 11.7 );
	mask = step( h.x, ndFlakeDensity );
