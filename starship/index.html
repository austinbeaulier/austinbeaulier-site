/* Layout: one full-bleed 3D view (overcast coastal sky), a telemetry strip pinned to the top with a
   top-view radar under it, thumb controls in the bottom corners, one card for title and results. */
:root {
  color-scheme: dark;
  --sky-top: #7a8187;
  --sky-low: #b7bbbc;
  --steel: #23272b;
  --ink: #0f1113;
  --panel: rgba(15, 17, 19, 0.78);
  --line: rgba(238, 241, 242, 0.16);
  --paper: #eef1f2;
  --dim: #a9b0b5;
  --plume: #ff8a5b;
  --go: #7ee0a1;
  --warn: #ffc857;
  --bad: #ff6b5e;
  --display: "Saira Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: linear-gradient(var(--sky-top), var(--sky-low));
  color: var(--paper);
  font-family: var(--data);
  font-size: 14px;
  overflow: hidden;
  position: relative;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  touch-action: none;
}
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#flash { position: absolute; inset: 0; background: #ffecd2; opacity: 0; pointer-events: none; }

.layer {
  position: absolute; inset: 0;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
  display: flex; flex-direction: column;
}

/* telemetry */
#hud { display: flex; flex-direction: column; gap: 6px; max-width: 560px; width: 100%; margin: 0 auto; }
.cells { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.cell {
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
  padding: 5px 8px 6px; min-width: 0;
}
.cell .k { font-size: 10px; letter-spacing: 0.12em; color: var(--dim); text-transform: uppercase; white-space: nowrap; }
.cell .v { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cell .v small { font-size: 10px; font-weight: 400; color: var(--dim); margin-left: 2px; }
.cell.ok .v { color: var(--go); }
.cell.hot .v { color: var(--bad); }
.strip {
  display: flex; align-items: center; gap: 8px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
  padding: 6px 8px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.strip .lbl { color: var(--dim); }
#fuelbar { flex: 1; min-width: 40px; height: 8px; background: rgba(238,241,242,0.14); border-radius: 2px; overflow: hidden; }
#fuelfill { height: 100%; width: 100%; background: var(--plume); transform-origin: left center; }
#fuelfill.low { background: var(--bad); }
#mute {
  pointer-events: auto; font: inherit; color: var(--paper); background: none;
  border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px; cursor: pointer;
  letter-spacing: 0.08em; text-transform: uppercase;
}
#mute:focus-visible, .btn:focus-visible, .pad:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }
#radar-box {
  align-self: flex-start; display: flex; flex-direction: column; gap: 3px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 5px;
}
#radar-box .k { font-size: 9px; letter-spacing: 0.12em; color: var(--dim); text-transform: uppercase; }
#radar { width: 104px; height: 104px; display: block; }
body.carded #radar-box { visibility: hidden; }
#cue {
  position: absolute; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none;
  font-family: var(--display); font-weight: 800; font-size: 40px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--plume); text-shadow: 0 2px 12px rgba(15,17,19,0.7); animation: cue 0.5s steps(2) infinite;
}
@keyframes cue { 50% { opacity: 0.45; } }
@media (prefers-reduced-motion: reduce) { #cue { animation: none; } }
.btn.alt { background: none; color: var(--paper); border: 1px solid var(--line); font-size: 16px; padding: 8px 16px; }

/* card */
#card-wrap { flex: 1; display: flex; align-items: flex-end; justify-content: center; min-height: 0; padding-bottom: 6px; }
@media (min-width: 900px) { #card-wrap { align-items: center; justify-content: flex-start; padding-left: 3vw; } }
#card {
  pointer-events: auto;
  width: min(420px, 100%);
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 20px 22px 22px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: flex; flex-direction: column; gap: 12px;
}
#card .eyebrow { font-size: 11px; letter-spacing: 0.16em; color: var(--dim); text-transform: uppercase; }
#card h1 {
  margin: 0; font-family: var(--display); font-weight: 800; font-size: 54px; line-height: 0.92;
  letter-spacing: 0.01em; text-transform: uppercase; text-wrap: balance;
}
#card h1.good { color: var(--go); }
#card h1.fail { color: var(--bad); }
#card p { margin: 0; line-height: 1.5; color: var(--paper); font-size: 13px; }
#card dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; font-size: 13px; font-variant-numeric: tabular-nums; }
#card dt { color: var(--dim); }
#card dd { margin: 0; text-align: right; }
#card dl .sum { border-top: 1px solid var(--line); padding-top: 6px; font-weight: 600; color: var(--paper); }
.limits { display: flex; flex-wrap: wrap; gap: 6px; }
.limits span { border: 1px solid var(--line); border-radius: 3px; padding: 3px 7px; font-size: 11px; letter-spacing: 0.06em; white-space: nowrap; }
.btn {
  font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink); background: var(--plume); border: 0; border-radius: 4px; padding: 10px 16px; cursor: pointer;
}
.btn:hover { filter: brightness(1.08); }
.keys { font-size: 11px; color: var(--dim); line-height: 1.6; }
.keys b { color: var(--paper); font-weight: 500; }

/* thumb controls */
#pads { display: none; justify-content: space-between; align-items: flex-end; gap: 12px; padding-bottom: 8px; margin-top: auto; }
body.touch #pads { display: flex; }
body.carded #pads { display: none; }
#stick {
  pointer-events: auto; touch-action: none; position: relative;
  width: 128px; height: 128px; border-radius: 50%;
  background: var(--panel); border: 1px solid var(--line);
}
#stick::before { content: ""; position: absolute; inset: 50% 14px auto; height: 1px; background: var(--line); }
#stick::after { content: ""; position: absolute; inset: 14px auto 14px 50%; width: 1px; background: var(--line); }
#knob {
  position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
  background: var(--paper); opacity: 0.85; z-index: 1;
}
.pad {
  pointer-events: auto; touch-action: none;
  background: var(--panel); border: 1px solid var(--plume); color: var(--paper);
  font-family: var(--display); font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  width: 108px; height: 108px; border-radius: 50%; font-size: 22px; letter-spacing: 0.1em; text-transform: uppercase;
}
.pad.on { background: var(--plume); color: var(--ink); }
@media (max-width: 420px) {
  .cell .v { font-size: 15px; }
  #card h1 { font-size: 44px; }
}
</style>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv = $('view');

// ---------- world (metres, y up; tower at origin, arms reach along +x) ----------
const G = 9.81, THRUST = 19, KD = 0.0015;
const R = 4.5, HALF = 25, PIN = 12;            // hull radius, half length, catch-pin height above centre
const TOWER = { half: 7, h: 146 };
const ARM = { y: 104, x0: 7, x1: 46, pz: 5.8, hw: 1.1, open: 20 * Math.PI / 180 };
const TARGET_X = 27;
const LIM = { vy: 12, vh: 8, tilt: 20 * Math.PI / 180 };
const SIDE = 11;                                // assisted top sideways speed, m/s
let assist = true;                              // assisted: side thrusters move the ship directly and stop its drift
function setAssist(on) {
  assist = on;
  LIM.vy = on ? 12 : 10; LIM.vh = on ? 8 : 6; LIM.tilt = (on ? 20 : 14) * Math.PI / 180;
}
const LEAN = 0.42;                              // full stick leans the ship this far (radians); released, it rights itself
const STEP = 1 / 120;
const PSI = 25 * Math.PI / 180;                // camera azimuth during flight; controls are relative to it
const CP = Math.cos(PSI), SP = Math.sin(PSI);

let W = 0, H = 0;
let mode = 'title';                             // title | playing | caught | lost
let level = 1, score = 0, best = 0;
let ship, fuelMax = 13, windBase = { x: 0, z: 0 }, wind = { x: 0, z: 0 }, gustPhase = 0, t = 0;
let particles = [], debris = [];
let blast = null;
let shake = 0, flash = 0, armDip = 0, armVel = 0, armAngle = ARM.open, resultTimer = 0, pendingResult = null;
const input = { jx: 0, jy: 0, burn: false };   // jx: screen right, jy: away from camera
const keys = { l: false, r: false, u: false, d: false };
const stick = { x: 0, y: 0 };

try { best = +localStorage.getItem('towercatch.best') || 0; } catch (e) {}

const gap = x => ARM.pz - ARM.hw + (x - ARM.x0) * Math.tan(armAngle);   // half-gap between the arms' inner faces at x
function axisOf(s) {
  const tx = Math.tan(s.ax), tz = Math.tan(s.az), n = Math.hypot(tx, 1, tz);
  return { x: tx / n, y: 1 / n, z: tz / n };
}
function hangingShip() {
  return { x: TARGET_X, y: ARM.y - PIN, z: 0, vx: 0, vy: 0, vz: 0, ax: 0, az: 0, wx: 0, wz: 0, fuel: 1, burning: false, dead: false, hx: TARGET_X, hz: 0 };
}
ship = hangingShip();
armAngle = 0;

function newFlight() {
  const n = Math.min(level, 9);
  // early flights arrive from the open side of the arms; later ones from anywhere
  const phi = level < (assist ? 7 : 4) ? (Math.random() - 0.5) * 2.0 : Math.random() * 6.283;
  const dist = assist ? 45 + Math.random() * 30 + n * 4 : 90 + Math.random() * 45 + n * 6;
  const dx = Math.cos(phi), dz = Math.sin(phi), sp = 8 + n * 1.3, lean = 0.1;
  fuelMax = Math.max(8.5, 16.5 - level * 0.7);
  const wa = Math.random() * 6.283, wm = level === 1 ? 0 : Math.min(0.2 + 0.25 * level, 2.5) * (0.5 + Math.random() * 0.5);
  windBase = { x: Math.cos(wa) * wm, z: Math.sin(wa) * wm };
  gustPhase = Math.random() * 6.28;
  ship = {
    x: TARGET_X + dx * dist, y: 440 + Math.random() * 40, z: dz * dist,
    vx: -dx * sp, vy: -(26 + n * 3), vz: -dz * sp,
    ax: dx * lean, az: dz * lean, wx: 0, wz: 0,
    fuel: fuelMax, burning: false, dead: false, hx: 0, hz: 0
  };
  particles = []; clearDebris(); blast = null;
  armDip = 0; armVel = 0; armAngle = ARM.open; shake = 0; flash = 0; pendingResult = null;
  mode = 'playing';
  hideCard();
  snapCamera();
}

// ---------- simulation ----------
function step(dt) {
  t += dt;
  const gust = 1 + 0.35 * Math.sin(t * 0.9 + gustPhase);
  wind.x = windBase.x * gust; wind.z = windBase.z * gust;
  const s = ship;

  if (mode === 'playing') {
    const prevPy = s.y + PIN * axisOf(s).y;
    const jx = clamp(input.jx, -1, 1), jy = clamp(input.jy, -1, 1);
    const rx = jx * CP - jy * SP, rz = -jx * SP - jy * CP;     // screen-relative stick to world tilt rates
    const lean = assist ? LEAN * 0.55 : LEAN;
    s.wx += ((rx * lean - s.ax) * 7 - s.wx * 4.5) * dt;       // the stick sets how far the ship leans
    s.wz += ((rz * lean - s.az) * 7 - s.wz * 4.5) * dt;
    s.ax += s.wx * dt; s.az += s.wz * dt;
    if (Math.abs(s.ax) > 1) { s.ax = clamp(s.ax, -1, 1); s.wx = 0; }
    if (Math.abs(s.az) > 1) { s.az = clamp(s.az, -1, 1); s.wz = 0; }
    const u = axisOf(s);
    const burning = input.burn && s.fuel > 0;
    const sp = Math.hypot(s.vx, s.vy, s.vz);
    let ax = wind.x - KD * s.vx * sp, ay = -G - KD * s.vy * sp, az = wind.z - KD * s.vz * sp;
    if (assist) {                                             // side thrusters hold the sideways speed the stick asks for; released, they stop the ship
      // close to the arms the top speed drops below the drift limit, and the ship is eased onto the centreline between them
      const alt = s.y + PIN * u.y - ARM.y, px = s.x + PIN * u.x, pz = s.z + PIN * u.z, top = clamp(alt / 12, 5, SIDE);
      let tz = rz * top;
      if (alt < 70 && alt > -2 && px > ARM.x0 + R && px < ARM.x1 && Math.abs(pz) < 16) tz = clamp(tz - pz * 0.7, -5, 5);
      ax += (rx * top - s.vx) * 2.2; az += (tz - s.vz) * 2.2;
    }
    if (burning) {
      ax += u.x * THRUST; ay += u.y * THRUST; az += u.z * THRUST;
      s.fuel = Math.max(0, s.fuel - dt);
      emitExhaust(s, u);
    }
    s.burning = burning;
    s.vx += ax * dt; s.vy += ay * dt; s.vz += az * dt;
    s.x += s.vx * dt; s.y += s.vy * dt; s.z += s.vz * dt;
    collide(prevPy);
  } else if (mode === 'caught') {
    // arms close on the hull and centre it; the ship swings on its pins and the arms flex
    armAngle += (0 - armAngle) * (1 - Math.exp(-5 * dt));
    s.hz += (0 - s.hz) * (1 - Math.exp(-4 * dt));
    s.wx += (-7 * s.ax - 2.6 * s.wx) * dt; s.ax += s.wx * dt;
    s.wz += (-7 * s.az - 2.6 * s.wz) * dt; s.az += s.wz * dt;
    armVel += (-60 * armDip - 7 * armVel) * dt; armDip += armVel * dt;
    const u = axisOf(s);
    s.x = s.hx - PIN * u.x; s.y = ARM.y + armDip - PIN * u.y; s.z = s.hz - PIN * u.z;
    if (Math.random() < 0.25) puff(s.x + (Math.random() - 0.5) * 6, s.y - HALF + 2, s.z + (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6, -4 - Math.random() * 5, (Math.random() - 0.5) * 6, 1.2, 2);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles[i] = particles[particles.length - 1]; particles.pop(); continue; }
    const ty = p.type;
    if (ty === 3) { const d = Math.exp(-1.7 * dt); p.vx *= d; p.vy = p.vy * d + 13 * dt; p.vz *= d; }            // fireball: slows, billows upward
    else if (ty === 4) { const d = Math.exp(-1.1 * dt); p.vx = p.vx * d + wind.x * dt * 2; p.vy = p.vy * d + 6 * dt; p.vz = p.vz * d + wind.z * dt * 2; }   // black smoke: rises, leans with the wind
    else if (ty === 5) { const d = Math.exp(-0.35 * dt); p.vx *= d; p.vy = p.vy * d - G * dt; p.vz *= d; }        // sparks: ballistic
    else if (ty === 6) { p.vy += 4 * dt; }
    else { p.vy -= dt; p.vx += wind.x * dt; p.vz += wind.z * dt; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    if (p.y < 0.5) { p.y = 0.5; if (ty === 5) { p.vy *= -0.3; p.life *= 0.6; } else p.vy = 0; p.vx *= 0.9; p.vz *= 0.9; }
  }
  if (blast) stepBlast(dt);
  for (const d of debris) {
    if (!d.on) continue;
    d.vy -= G * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt; d.r += d.w * dt;
    if (d.y < 1) { d.y = 1; d.vy *= -0.3; d.vx *= 0.6; d.vz *= 0.6; d.w *= 0.5; }
  }
  shake = Math.max(0, shake - dt * 1.6);
  flash = Math.max(0, flash - dt * 2.5);

  if (pendingResult) {
    resultTimer -= dt;
    if (resultTimer <= 0) { const r = pendingResult; pendingResult = null; r(); }
  }
}

function collide(prevPy) {
  const s = ship, u = axisOf(s);
  const px = s.x + PIN * u.x, py = s.y + PIN * u.y, pz = s.z + PIN * u.z;
  const tilt = Math.acos(clamp(u.y, -1, 1)), vh = Math.hypot(s.vx, s.vz);

  // the catch pins reaching arm height
  if (prevPy > ARM.y && py <= ARM.y && px > ARM.x0 && px < ARM.x1 + R && Math.abs(pz) < gap(px) + 3) {
    if (px < ARM.x0 + R) return lose('Hit the tower', 'The hull struck the tower on the way into the arms.');
    if (px > ARM.x1 - 1) return lose('Clipped the arm tips', 'Too far out. The pins have to come down inside the arms.');
    if (Math.abs(pz) > gap(px) - R + (assist ? 2.6 : 1.2)) return lose('Hit an arm', 'Off to one side. The ship has to come down between the two arms.');

function resize() {

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(W, H, false);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  snapCamera();
}

function cameraGoal() {
  const s = ship, ty = ARM.y - 14;
  const cx = (s.x + TARGET_X) / 2, cy = (s.y + ty) / 2, cz = s.z / 2;
  const r = Math.hypot(s.x - TARGET_X, s.y - ty, s.z) / 2 + 52;
  const vh = camera.fov * Math.PI / 360, hh = Math.atan(Math.tan(vh) * camera.aspect);
  const d = 1.1 * r / Math.sin(Math.min(vh, hh)), el = 0.15;
  // keep the action clear of the telemetry strip, or of the card when it fills the lower screen
  const ly = cy + r * (document.body.classList.contains('carded') && W < 900 ? -0.75 : 0.2);
  return { px: cx + Math.sin(psiNow) * Math.cos(el) * d, py: Math.max(6, cy + Math.sin(el) * d), pz: cz + Math.cos(psiNow) * Math.cos(el) * d, lx: cx, ly: ly, lz: cz };
}
function snapCamera() {

function moveCamera(dt) {

  camPos.x += (g.px - camPos.x) * k; camPos.y += (g.py - camPos.y) * k; camPos.z += (g.pz - camPos.z) * k;
  camLook.x += (g.lx - camLook.x) * k; camLook.y += (g.ly - camLook.y) * k; camLook.z += (g.lz - camLook.z) * k;
}

function envelope() {
  const s = ship, u = axisOf(s);

}

function render(now, dt) {
  const s = ship, u = axisOf(s), q = gfx;
  let sx = 0, sy = 0;
  if (shake > 0) { const m = shake * Math.hypot(camPos.x - camLook.x, camPos.z - camLook.z) * 0.012; sx = (Math.random() - 0.5) * m; sy = (Math.random() - 0.5) * m; }

  q.shipG.visible = !s.dead;
  q.shipG.position.set(s.x, s.y, s.z);

  q.flame.visible = s.burning;

  q.armGroup.position.y = ARM.y + armDip;
  for (const a of q.arms) a.g.rotation.y = -a.sgn * armAngle;
  const e = envelope();
  q.railMat.emissive.copy(mode === 'caught' || (mode === 'playing' && e.vy && e.vh && e.tilt) ? q.cGo : q.cWarn);

  const guide = mode === 'playing';
  if (guide) predict();
  q.predPts.visible = guide && pred.n > 0;
  if (guide) { q.predG.attributes.position.needsUpdate = true; q.predG.setDrawRange(0, pred.n); }
  q.ring.visible = guide && pred.hit;
  if (q.ring.visible) { q.ring.position.set(pred.x, ARM.y + 0.6, pred.z); q.ringMat.color.copy(pred.ok ? q.cGo : q.cWarn); }

  let n = 0;

      else if (a < 0.7) { const f = (a - 0.3) / 0.4; r = 1 - 0.2 * f; g = 0.58 - 0.38 * f; b = 0.12 - 0.09 * f; }
      else { const f = (a - 0.7) / 0.3; r = 0.8 - 0.5 * f; g = 0.2 - 0.14 * f; b = 0.03; }
      r *= I; g *= I; b *= I; al = 0.7 * Math.pow(k, 0.6); sz = p.size * (0.45 + 1.25 * Math.sqrt(a));

    q.blastL.intensity = 16 * Math.exp(-t * 2.4) + 3 * Math.max(0, 1 - t / 7) * (0.75 + 0.5 * Math.random());
    q.shock.visible = t < 0.55;
    if (q.shock.visible) { q.shock.position.set(blast.x, blast.y0, blast.z); q.shock.scale.setScalar(18 + t * 300); q.shock.material.opacity = 0.32 * (1 - t / 0.55); }

  } else { q.blastL.intensity = 0; q.shock.visible = q.dustRing.visible = false; }
  q.pG.setDrawRange(0, n);
  q.pG.attributes.position.needsUpdate = q.pG.attributes.aCol.needsUpdate = q.pG.attributes.aSize.needsUpdate = q.pG.attributes.aRot.needsUpdate = true;
  q.pMat.uniforms.uScale.value = renderer.domElement.height / (2 * Math.tan(camera.fov * Math.PI / 360));

  for (const d of debris) { d.m.visible = d.on; if (d.on) { d.m.position.set(d.x, d.y, d.z); d.m.rotation.set(d.r, d.r * 0.7, d.r * 1.3); } }
  for (const b of q.birds) {
    const a = now * b.sp + b.ph, f = Math.sin(now * 7 + b.ph) * 0.6;

    b.a.rotation.z = f; b.b.rotation.z = -f;
  }

}

// ---------- radar (top view, oriented like the camera: up is away from you) ----------
const rc = $('radar').getContext('2d');
function radar() {
  const S = 208, k = S / 110, c = rc;
  const map = (x, z) => { const dx = x - TARGET_X, dz = z; return [S / 2 + (dx * CP - dz * SP) * k, S / 2 + (dx * SP + dz * CP) * k]; };
  c.clearRect(0, 0, S, S);
  c.lineCap = 'round';
  // tower
  c.fillStyle = '#5c646a'; c.beginPath();
  [[-7, -7], [7, -7], [7, 7], [-7, 7]].forEach((p, i) => { const m = map(p[0], p[1]); i ? c.lineTo(m[0], m[1]) : c.moveTo(m[0], m[1]); }); c.fill();
  // arms
  const e = envelope(), good = mode === 'caught' || (mode === 'playing' && e.vy && e.vh && e.tilt);
  c.strokeStyle = good ? '#7ee0a1' : '#ffc857'; c.lineWidth = 5;
  for (const sgn of [-1, 1]) {
    const a = map(ARM.x0, sgn * ARM.pz), L = ARM.x1 - ARM.x0, b = map(ARM.x0 + L * Math.cos(armAngle), sgn * (ARM.pz + L * Math.sin(armAngle)));
    c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke();
  }
  if (mode === 'title') return;
  if (mode === 'playing' && pred.hit) {
    const m = map(pred.x, pred.z); m[0] = clamp(m[0], 8, S - 8); m[1] = clamp(m[1], 8, S - 8);
    c.strokeStyle = pred.ok ? '#7ee0a1' : '#ffc857'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(m[0] - 7, m[1] - 7); c.lineTo(m[0] + 7, m[1] + 7); c.moveTo(m[0] + 7, m[1] - 7); c.lineTo(m[0] - 7, m[1] + 7); c.stroke();
  }
  if (!ship.dead) {
    const u = axisOf(ship), m = map(ship.x + PIN * u.x, ship.z + PIN * u.z);
    const out = m[0] < 8 || m[0] > S - 8 || m[1] < 8 || m[1] > S - 8;
    m[0] = clamp(m[0], 8, S - 8); m[1] = clamp(m[1], 8, S - 8);
    c.fillStyle = '#eef1f2'; c.strokeStyle = '#eef1f2'; c.lineWidth = 2.5;
    c.beginPath(); c.arc(m[0], m[1], out ? 5 : R * k, 0, 6.3); out ? c.fill() : c.stroke();
    if (!out) { c.beginPath(); c.arc(m[0], m[1], 2, 0, 6.3); c.fill(); }
  }

    const dx = (wind.x * CP - wind.z * SP) / wm, dy = (wind.x * SP + wind.z * CP) / wm, ox = 22, oy = S - 22;
    c.strokeStyle = '#a9b0b5'; c.lineWidth = 2.5;
    c.beginPath(); c.moveTo(ox - dx * 12, oy - dy * 12); c.lineTo(ox + dx * 12, oy + dy * 12);
    c.lineTo(ox + dx * 12 - (dx * 7 - dy * 5), oy + dy * 12 - (dy * 7 + dx * 5)); c.moveTo(ox + dx * 12, oy + dy * 12);
    c.lineTo(ox + dx * 12 - (dx * 7 + dy * 5), oy + dy * 12 - (dy * 7 - dx * 5)); c.stroke();
  }
}

// ---------- HUD ----------
const el = { alt: $('v-alt'), vy: $('v-vy'), vx: $('v-vx'), tilt: $('v-tilt'), wind: $('v-wind'), level: $('v-level'), score: $('v-score'), fuel: $('fuelfill') };
const cells = { vy: $('c-vy'), vx: $('c-vx'), tilt: $('c-tilt') };
function setCell(c, ok, near) { c.classList.toggle('ok', ok); c.classList.toggle('hot', !ok && near); }
function hud() {
  const s = ship, u = axisOf(s), alt = s.y + PIN * u.y - ARM.y, e = envelope();

// ---------- card ----------

  const b = $('go'); if (b) b.addEventListener('click', act);
}

// ---------- input ----------
const keymap = { ArrowLeft: 'l', a: 'l', A: 'l', ArrowRight: 'r', d: 'r', D: 'r', ArrowUp: 'u', w: 'u', W: 'u', ArrowDown: 'd', s: 'd', S: 'd' };
let keyBurn = false, padBurn = false;
function syncInput() {
  input.jx = clamp((keys.r ? 1 : 0) - (keys.l ? 1 : 0) + stick.x, -1, 1);
  input.jy = clamp((keys.u ? 1 : 0) - (keys.d ? 1 : 0) + stick.y, -1, 1);

}
addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') return toggleMute();

  if ((e.key === 'Enter' || e.key === ' ') && primary && !e.repeat) { e.preventDefault(); return act(); }
  if (e.key === ' ' || e.key === 'Shift') { keyBurn = true; e.preventDefault(); audioOn(); }

});
addEventListener('keyup', e => {
  if (e.key === ' ' || e.key === 'Shift') keyBurn = false;
  const k = keymap[e.key]; if (k) keys[k] = false;
  syncInput();

addEventListener('blur', () => { keys.l = keys.r = keys.u = keys.d = keyBurn = false; syncInput(); });
(() => {
  const b = $('p-burn');
  const set = v => { padBurn = v; b.classList.toggle('on', v); syncInput(); };
  b.addEventListener('pointerdown', e => { e.preventDefault(); audioOn(); try { b.setPointerCapture(e.pointerId); } catch (x) {} set(true); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(ev, () => set(false));
  b.addEventListener('contextmenu', e => e.preventDefault());
  const st = $('stick'), knob = $('knob');
  let pid = null;
  const move = e => {
    const r = st.getBoundingClientRect(), m = r.width / 2 - 20;
    let x = (e.clientX - r.left - r.width / 2) / m, y = (e.clientY - r.top - r.height / 2) / m;
    const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; }
    stick.x = x; stick.y = -y; knob.style.transform = 'translate(' + (x * m).toFixed(1) + 'px,' + (y * m).toFixed(1) + 'px)'; syncInput();
  };
  const end = () => { pid = null; stick.x = stick.y = 0; knob.style.transform = ''; syncInput(); };
  st.addEventListener('pointerdown', e => { e.preventDefault(); audioOn(); pid = e.pointerId; try { st.setPointerCapture(pid); } catch (x) {} move(e); });
  st.addEventListener('pointermove', e => { if (e.pointerId === pid) move(e); });

})();
if ((window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window) document.body.classList.add('touch');
addEventListener('touchstart', () => document.body.classList.add('touch'), { passive: true });

// ---------- sound ----------
let ac = null, engineGain = null, muted = false, noiseBuf = null;
function audioOn() {
  if (ac || muted) { if (ac && ac.state === 'suspended') ac.resume(); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC();
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); let last = 0;
    for (let i = 0; i < d.length; i++) { last = last * 0.96 + (Math.random() * 2 - 1) * 0.3; d[i] = last; }
    const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520;
    engineGain = ac.createGain(); engineGain.gain.value = 0;
    src.connect(lp).connect(engineGain).connect(ac.destination); src.start();
  } catch (e) { ac = null; }
}
function sfxBoom() {
  if (!ac || muted) return;
  const src = ac.createBufferSource(); src.buffer = noiseBuf;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(900, ac.currentTime); lp.frequency.exponentialRampToValueAtTime(60, ac.currentTime + 1.6);
  const g = ac.createGain(); g.gain.setValueAtTime(1.6, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 1.8);
  src.connect(lp).connect(g).connect(ac.destination); src.start(); src.stop(ac.currentTime + 1.9);
}
function sfxCatch() {
  if (!ac || muted) return;
  [[196, 0], [294, 0.09], [392, 0.18]].forEach(([f, d]) => {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, ac.currentTime + d); g.gain.exponentialRampToValueAtTime(0.18, ac.currentTime + d + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d + 0.7);
    o.connect(g).connect(ac.destination); o.start(ac.currentTime + d); o.stop(ac.currentTime + d + 0.8);
  });
}
function toggleMute() {
  muted = !muted;
  const b = $('mute'); b.textContent = muted ? 'Muted' : 'Mute'; b.setAttribute('aria-pressed', String(muted));
  if (!muted) audioOn();
}
$('mute').addEventListener('click', toggleMute);

// ---------- loop ----------
let lastT = 0, acc = 0;
function frame(ms) {
  const now = ms / 1000;
  const dt = Math.min(0.05, now - lastT || 0); lastT = now;
  acc += dt;

  moveCamera(dt);
  if (engineGain) engineGain.gain.setTargetAtTime(ship.burning && !muted ? 0.55 : 0, ac.currentTime, 0.05);
  render(now, dt);
  radar();
  hud();
  requestAnimationFrame(frame);
}

showCard('<div class="eyebrow">Ship return · catch attempt</div><h1>Tower Catch</h1><p>Painting the steel, tiles and concrete…</p>', null);
setTimeout(() => {
  let ok3d = true;
  try { if (!window.THREE) throw new Error('no three'); buildScene(); } catch (e) { ok3d = false; }
  if (ok3d) {
    addEventListener('resize', resize);
    resize();
    titleCard();
    requestAnimationFrame(frame);
    return;
  }
  showCard('<div class="eyebrow">Cannot start</div><h1 class="fail">No 3D</h1><p>This browser could not start WebGL, which the game needs to draw its 3D scene. Try another browser or turn on hardware acceleration.</p>', null);
}, 60);

// hook for automated play-testing
window.__tc = { input, step, start: () => act(), state: () => ({ mode, level, score, ship, fuelMax, wind, armAngle }), consts: { ARM, PIN, TARGET_X, CP, SP }, setAssist };
})();
</script>
</body>
